[project]
name = "aegis"
version = "0.1.0"
description = "Aegis-ML: Adversarial ML Defense Lab - attacks, defenses, and a secure continuous-training pipeline for a small image classifier."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "kamalesansam" }]
keywords = ["adversarial-ml", "security", "mlops", "devsecops", "model-defense"]

dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "pandas>=2.2",
    "pandera>=0.20",
    "safetensors>=0.4",
    "fastapi>=0.143.3",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "prometheus-client>=0.20",
    "mlflow-skinny>=3.17.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
aegis = "aegis.cli:app"

[project.urls]
Homepage = "https://github.com/kamalesansam/aegis-ml"
Repository = "https://github.com/kamalesansam/aegis-ml"

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.17.1",
    "bandit[sarif]>=1.9.4",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

# PyTorch CPU wheels on Linux so CI/Docker do not pull CUDA.
# macOS resolves torch from the default PyPI index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
extend-exclude = [".semgrep"]  # deliberately insecure rule-test fixtures
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["aegis"]
omit = ["*/tests/*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
