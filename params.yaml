# Aegis-ML configuration. Every threshold, epsilon, rate and seed lives here.
# The pipeline, attacks, defenses and report all read these values.

seed: 1337

data:
  # scikit-learn load_digits: 8x8 grayscale, 10 classes, 1797 samples. No download.
  val_size: 0.15
  test_size: 0.20
  pixel_max: 16.0 # digits pixels are 0..16; divide to scale into [0,1]

model:
  conv1_out: 16
  conv2_out: 32
  fc_hidden: 64 # penultimate feature width used by spectral signatures
  epochs: 18
  batch_size: 64
  lr: 0.002
  weight_decay: 0.0001

# Projected Gradient Descent adversarial training (Madry et al.)
adv_training:
  enabled: false # toggled per scenario / CLI
  eps: 0.2
  step_size: 0.05
  steps: 7
  random_start: true
  adv_weight: 0.5 # fraction of each batch replaced by adversarial examples

attacks:
  evasion:
    eps_grid: [0.05, 0.1, 0.2, 0.3]
    pgd:
      eps: 0.2
      step_size: 0.05
      steps: 20
      random_start: true
  poisoning:
    label_flip:
      rate: 0.30 # random symmetric label noise (DNNs tolerate lower rates)
      source_class: 1 # for targeted flip demos
      target_class: 7
    backdoor:
      poison_rate: 0.06 # fraction of training set stamped + relabeled to target
      target_class: 0
      patch_size: 2 # bright 2x2 patch
      patch_value: 1.0 # already in [0,1]
  extraction:
    query_budgets: [250, 500, 1000, 2000]
    surrogate_epochs: 20
    noise_fraction: 0.5 # share of queries that are pure random noise

defenses:
  poison_detection:
    label_noise:
      cv_folds: 5
      # flag a sample if its out-of-fold prob for its given label is below
      # (per-class mean self-confidence) * margin
      margin: 0.55
    spectral:
      n_singular: 3 # score = squared projection onto top-n singular subspace
      size_mult: 1.4 # a class is "suspect" if its size exceeds size_mult * median
      overcollect: 1.3 # remove overcollect * (size excess) top-scored per suspect class
  input_detection:
    feature_squeezing:
      bit_depth: 1 # reduce to 1-bit pixels (strongest squeezer on this coarse data)
      median_kernel: 2 # 2x2 median filter
      target_fpr: 0.05 # calibrate threshold to ~5% FPR on clean val
  extraction_detection:
    prada:
      min_queries: 50 # start Shapiro testing after this many queries
      shapiro_threshold: 0.90 # flag when W < threshold (non-normal growth distances)
      growth_window: 100 # most recent minimum-distance values considered

# Security gates for the secure continuous-training pipeline.
# A retrain is only promoted when all gates pass.
gates:
  min_clean_accuracy: 0.92
  min_pgd_robust_accuracy: 0.30
  max_backdoor_asr: 0.15

api:
  rate_limit_per_minute: 600 # coarse abuse limit; PRADA handles extraction patterns
  confidence_decimals: 2

paths:
  artifacts_dir: artifacts
  quarantine_dir: quarantine
  mlruns_dir: mlruns
  reports_dir: reports
  model_name: aegis_cnn
